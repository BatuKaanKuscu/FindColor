workflows:
  ios-unsigned-check:
    name: iOS Unsigned Check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.renkyama.colordetector
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run unit tests
        script: flutter test
      - name: Enable Swift Package Manager
        script: flutter config --enable-swift-package-manager
      - name: Clear Xcode cache
        script: rm -rf ~/Library/Developer/Xcode/DerivedData
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
